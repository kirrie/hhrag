[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhrag"
version = "0.1.0"
description = "PaperQA2와 bge-m3 기반 석사논문 PDF 로컬 벡터 인덱싱 및 Codex MCP 서버"
readme = "readme.md"
requires-python = ">=3.11,<3.15"
dependencies = [
	"paper-qa[local]>=5.0.0",
	"mcp>=1.0.0",
	"sentence-transformers>=3.0.0",
	"pypdf>=4.0.0",
]

[project.scripts]
hhrag = "hhrag.cli:main"

[dependency-groups]
dev = [
	"pytest>=8.0.0",
	"pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hhrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
